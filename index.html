<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="theme-color" content="#071b32"><title>Penalty Kings</title>
<style>
:root{--bg:#071b32;--panel:#102b49;--gold:#ffd166;--green:#16834a;--white:#f7fbff}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at top,#17466a,#071b32 65%);color:var(--white);font-family:system-ui,-apple-system,Segoe UI,Arial,sans-serif;min-height:100vh}.wrap{max-width:920px;margin:auto;padding:20px 14px 36px}.top{text-align:center}.logo{font-size:clamp(30px,7vw,54px);font-weight:1000;letter-spacing:1px;margin:5px 0;color:var(--gold);text-shadow:0 4px 0 #8c5b14}.sub{color:#c4d5e7;margin:0 0 16px}.panel{background:#102b49eF;border:1px solid #42617f;border-radius:18px;padding:15px;box-shadow:0 12px 35px #0005}.controls{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;align-items:end}.field label{display:block;font-size:13px;color:#c8d8e8;margin-bottom:6px}.field select,.field input{width:100%;accent-color:var(--gold)}select{padding:10px;border-radius:10px;border:1px solid #55718e;background:#071b32;color:white;font:inherit}.statrow{display:flex;justify-content:space-around;gap:8px;margin:14px 0;text-align:center}.stat{background:#071b32;border-radius:12px;padding:9px 14px;min-width:90px}.stat small{display:block;color:#b8cadd;font-size:11px;text-transform:uppercase}.stat strong{font-size:23px}.pitchbox{position:relative;margin-top:14px;border:5px solid #eaf5e9;border-radius:15px;overflow:hidden;background:#18884c;aspect-ratio:16/9;min-height:210px}.pitch{position:absolute;inset:0;background:repeating-linear-gradient(0deg,#168348 0 42px,#1b9051 42px 84px)}.line{position:absolute;border:2px solid #e9f5e7aa}.boxarea{width:56%;height:35%;left:22%;top:0;border-top:0}.six{width:27%;height:17%;left:36.5%;top:0;border-top:0}.spot{position:absolute;width:9px;height:9px;border-radius:50%;background:#fff;left:calc(50% - 4px);top:25%}.goal{position:absolute;top:4%;left:29%;width:42%;height:23%;border:7px solid #fff;border-top-width:9px;border-bottom:0;background:repeating-linear-gradient(90deg,#ffffff22 0 3px,transparent 3px 18px),repeating-linear-gradient(0deg,#ffffff22 0 3px,transparent 3px 18px);filter:drop-shadow(0 3px 2px #0007)}.keeper{position:absolute;top:11%;left:50%;transform:translateX(-50%);font-size:clamp(34px,7vw,58px);transition:left .25s ease;filter:drop-shadow(0 3px 2px #0008)}.ball{position:absolute;left:50%;top:75%;transform:translate(-50%,-50%);font-size:30px;transition:left .5s ease,top .5s ease;z-index:3}.aimline{position:absolute;left:50%;top:31%;width:2px;height:43%;background:#ffffff55;transform-origin:bottom;pointer-events:none}.pitchhint{position:absolute;bottom:8px;left:0;right:0;text-align:center;font-weight:700;text-shadow:0 2px 3px #000}.actions{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-top:14px}.btn{border:0;border-radius:12px;padding:12px 20px;font-weight:900;font-size:16px;cursor:pointer}.shoot{background:var(--gold);color:#17253a}.reset{background:#294b6d;color:white}.btn:disabled{opacity:.5;cursor:not-allowed}.sliders{display:grid;grid-template-columns:1fr 1fr;gap:18px;margin-top:14px}.slider label{display:flex;justify-content:space-between;font-size:13px;color:#d4e1ed}.slider input{width:100%;accent-color:var(--gold)}#message{text-align:center;font-weight:800;min-height:26px;margin:12px 0 0;color:var(--gold)}.foot{text-align:center;color:#9fb5c9;font-size:12px;margin-top:15px}@media(max-width:600px){.controls{grid-template-columns:1fr 1fr}.controls .field:first-child{grid-column:1/-1}.stat{min-width:0;flex:1;padding:8px 5px}.stat strong{font-size:20px}.pitchbox{min-height:205px}.sliders{gap:12px}}
</style></head>
<body><main class="wrap"><header class="top"><div class="logo">⚽ PENALTY KINGS</div><p class="sub">Take your shot. Beat the keeper. Become the king.</p></header>
<section class="panel"><div class="controls"><div class="field"><label for="team">Choose your team</label><select id="team"><option value="#1456a0">Chelsea</option><option value="#d71920">Arsenal</option><option value="#c8102e">Liverpool</option><option value="#55a6e8">Manchester City</option><option value="#f5f5f5">Real Madrid</option><option value="#a50044">Barcelona</option><option value="#1746a2">PSG</option><option value="#dc1c2e">Bayern Munich</option></select></div><div class="field"><label>Match</label><div style="padding:10px 2px;font-weight:800">Penalty shootout</div></div><div class="field"><label>Shots</label><div style="padding:10px 2px;font-weight:800">5 attempts</div></div></div>
<div class="statrow"><div class="stat"><small>Goals</small><strong id="goals">0</strong></div><div class="stat"><small>Shots</small><strong id="shots">0 / 5</strong></div><div class="stat"><small>Saved / Missed</small><strong id="saved">0</strong></div></div>
<div class="pitchbox"><div class="pitch"></div><div class="line boxarea"></div><div class="line six"></div><div class="spot"></div><div class="goal"></div><div class="keeper" id="keeper">🧤</div><div class="aimline" id="aimline"></div><div class="ball" id="ball">⚽</div><div class="pitchhint" id="kit">CHELSEA</div></div>
<div class="sliders"><div class="slider"><label for="aim">Aim <b id="aimval">50%</b></label><input id="aim" type="range" min="8" max="92" value="50"></div><div class="slider"><label for="power">Power <b id="powerval">70%</b></label><input id="power" type="range" min="25" max="100" value="70"></div></div>
<div id="message" aria-live="polite">Set your aim and power, then shoot!</div><div class="actions"><button class="btn shoot" id="shoot">SHOOT ⚽</button><button class="btn reset" id="reset">Restart</button></div></section><p class="foot">Fan-made football game demo. Club names are for team selection; no official club logos are used.</p></main>
<script>
const $=id=>document.getElementById(id);let goals=0,shots=0,saved=0,busy=false;const aim=$('aim'),power=$('power'),ball=$('ball'),keeper=$('keeper');function update(){ $('aimval').textContent=aim.value+'%';$('powerval').textContent=power.value+'%';$('aimline').style.transform=`translateX(-50%) rotate(${(aim.value-50)*.65}deg)`;}aim.addEventListener('input',update);power.addEventListener('input',update);$('team').addEventListener('change',()=>{let opt=$('team').selectedOptions[0];$('kit').textContent=opt.text.toUpperCase();$('kit').style.color=opt.value==='#f5f5f5'?'#fff':opt.value;$('kit').style.textShadow='0 2px 4px #000';});function scoreboard(){$('goals').textContent=goals;$('shots').textContent=shots+' / 5';$('saved').textContent=saved;}function resetBall(){ball.style.left='50%';ball.style.top='75%';}function shoot(){if(busy||shots>=5)return;busy=true;$('shoot').disabled=true;const x=Number(aim.value),p=Number(power.value);const keeperX=18+Math.random()*64;keeper.style.left=keeperX+'%';const targetX=x;const save=Math.abs(targetX-keeperX)<(p>88?12:19)&&Math.random()<.78;const miss=(p>94&&Math.random()<.25)||(targetX<12||targetX>88);ball.style.left=(miss?(targetX<50?3:97):targetX)+'%';ball.style.top=(miss?'-5%':'24%');setTimeout(()=>{shots++;if(miss){saved++;$('message').textContent='OVER THE BAR! Try a different aim or power.';}else if(save){saved++;$('message').textContent='SAVED! The goalkeeper got there!';}else{goals++;$('message').textContent='GOOOAL! What a penalty! 🔥';}scoreboard();if(shots===5){$('message').textContent+=` Final score: ${goals}/5.`;$('shoot').textContent='FINISHED';}else{$('shoot').disabled=false;}setTimeout(()=>{resetBall();keeper.style.left='50%';busy=false;},650);},520);} $('shoot').addEventListener('click',shoot);$('reset').addEventListener('click',()=>{goals=0;shots=0;saved=0;busy=false;$('shoot').disabled=false;$('shoot').textContent='SHOOT ⚽';$('message').textContent='Set your aim and power, then shoot!';keeper.style.left='50%';resetBall();scoreboard();});update();scoreboard();
</script></body></html>
